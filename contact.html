<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | TechNexus</title>
  <meta name="description" content="Get in touch with TechNexus support, editorial team, or store administration for sponsorships, guides feedback, or product orders.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header></header>

  <main style="max-width: 800px;">
    <div class="content-wrapper">
      <div class="content-header">
        <h1>Contact TechNexus</h1>
        <p style="color: var(--text-tertiary);">Got inquiries, repair requests, or custom store questions? Write to us.</p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr; gap: 2.5rem; margin-bottom: 2rem;">
        <div>
          <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Direct Channels</h2>
          <div style="display: flex; flex-direction: column; gap: 1rem; color: var(--text-secondary);">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <svg style="width:20px;height:20px;color:var(--accent-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
              <span>support@technexusportal.com</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <svg style="width:20px;height:20px;color:var(--accent-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span>TechNexus HQ, Colombo, Sri Lanka</span>
            </div>
          </div>
        </div>

        <form onsubmit="event.preventDefault(); alert('Message sent successfully! We will get back to you shortly.'); this.reset();">
          <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Send a Message</h2>
          
          <div class="form-group">
            <label class="form-label" for="contact-name">Your Name</label>
            <input type="text" id="contact-name" class="form-control" placeholder="Enter your full name" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="contact-email">Email Address</label>
            <input type="email" id="contact-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" class="form-control" placeholder="e.g. Repair Inquiry, Store order" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="contact-message">Message</label>
            <textarea id="contact-message" class="form-control" rows="5" placeholder="Type your message in detail here..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer></footer>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- App Custom Logic -->
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
